<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="NetInventory">
  <defs>
    <linearGradient id="niG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="22" fill="#0c111a"/>
  <rect x="0.75" y="0.75" width="94.5" height="94.5" rx="21.25" fill="none" stroke="#1e2a3c"/>

  <!-- discovery sweep radiating from the scanner -->
  <g fill="none" stroke="url(#niG)" stroke-linecap="round" opacity=".3">
    <path d="M31 62a24 24 0 0 1 34 0" stroke-width="2"/>
    <path d="M24 69a34 34 0 0 1 48 0" stroke-width="2"/>
  </g>

  <!-- links from hub to each discovered device -->
  <g stroke="url(#niG)" stroke-width="1.8" opacity=".55">
    <path d="M48 48L26 30M48 48l22-18M48 48v-22"/>
  </g>

  <!-- discovered devices, MAC-keyed -->
  <g fill="none" stroke="url(#niG)" stroke-width="2.2" stroke-linejoin="round">
    <rect x="17" y="20" width="18" height="13" rx="2.5"/>
    <rect x="61" y="20" width="18" height="13" rx="2.5"/>
    <rect x="42" y="12" width="12" height="17" rx="3"/>
  </g>
  <g fill="url(#niG)" opacity=".9">
    <rect x="21" y="24" width="10" height="2" rx="1"/>
    <rect x="65" y="24" width="10" height="2" rx="1"/>
    <rect x="45" y="16" width="6" height="2" rx="1"/>
  </g>

  <!-- the scanner hub -->
  <circle cx="48" cy="48" r="9.5" fill="#0c111a" stroke="url(#niG)" stroke-width="2.6"/>
  <circle cx="48" cy="48" r="3.4" fill="url(#niG)"/>

  <!-- inventory rows. Solid fill, not the gradient — a horizontal line has a
       zero-height objectBoundingBox, so a gradient stroke never paints. -->
  <path d="M33 79h30" stroke="#3fe0cb" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M40 86h16" stroke="#3fe0cb" stroke-width="2.2" stroke-linecap="round" opacity=".45"/>
</svg>
