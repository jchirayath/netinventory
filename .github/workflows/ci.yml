name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# Read-only token; actions pinned to full commit SHAs (tags can be moved).
permissions:
  contents: read

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s engine/tests -v

  leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No network-data files tracked
        run: |
          for f in devices.csv report.md report-by-device.csv inventory.xlsx \
                   wifi_scan.csv cloud_devices.csv events.csv home_ssids.txt \
                   router_cookies.txt monitors.csv monitor_state.json \
                   battery_log.csv battery_history.csv audit.csv; do
            if git ls-files --error-unmatch "engine/$f" >/dev/null 2>&1; then
              echo "::error::network-data file is tracked: engine/$f"; exit 1
            fi
          done
      - name: No real MACs committed
        # Every MAC is judged on its own (a fake one on the same line no longer
        # hides a real one). An 8-byte Govee id is judged by its last 6 bytes,
        # the part read as a MAC. Allowed: the RFC 7042 documentation range
        # (00:00:5E:00:53:xx, and 02:... with the local bit), the fixture
        # prefixes the tests use, and a vendor prefix with a 00:00:xx device
        # part (tests that need a real OUI).
        run: |
          allow='^(00:00:5E:00:53|02:00:5E:00:53|AA:BB:CC|AA:00:00|A2:00:00|00:11:22|11:22:AA|08:00:27|AC:11:22|AC:AA:00|AE:11:22|00:AA:BB|00:00:0C|99:99:BB|DE:AD:BE|FF:FF:FF)|^..:..:..:00:00:..$'
          hits=$(git grep -InoE '([0-9a-fA-F]{2}:){5,7}[0-9a-fA-F]{2}' \
                   -- ':!engine/data/*' ':!*.gz' \
                 | awk -F: -v allow="$allow" '{
                     mac = toupper($(NF-5) ":" $(NF-4) ":" $(NF-3) ":" $(NF-2) ":" $(NF-1) ":" $NF)
                     if (mac !~ allow) print $1 ":" $2 ": " mac }' \
                 || true)
          if [ -n "$hits" ]; then
            echo "::error::possible real MAC address committed:"; echo "$hits"; exit 1
          fi
          echo "clean — no real MACs, no data files"

  app-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: stable
      - name: Flutter analyze + test
        working-directory: app
        run: |
          flutter pub get
          # Warnings and errors fail the build; info-level notices (such as a
          # new stable release deprecating an import) are shown, not fatal.
          flutter analyze --no-fatal-infos
          flutter test
